# TAP: semiflexible chain -> tangentially active polymer, N=20, Pe=0 (passive).
#
#   python -m eesi.systems.tap.run train --config experiments/TAP/configs/tap_N20_Pe0.yaml
#
# The settings below are the ones TAP.ipynb was using, so a run from this file
# reproduces the notebook's numbers and then keeps going.
#
# Unknown keys are an ERROR, not a warning: a typo in a 200k-step run should fail in
# the first second rather than quietly produce a defaulted run. Note that PyYAML only
# reads `1.0e-4` as a number, not `1e-4` -- both are accepted here, but the second
# arrives as a string and is converted, so prefer the first.

name: tap_N20_Pe0        # the run lives in <out_dir>/<name>/
out_dir: runs            # already gitignored
device: auto             # auto | cpu | cuda | cuda:1
dtype: float64           # float64 is what every TAP hook assumes; float32 is untested
seed: 20                 # model initialisation, and any stage that omits `seed`

data:
  path: data/tap_N20_Pe0.npy   # null -> tap.data.REF_DATA_PATH ($EESI_DATA_DIR applies)
  n: 100000                    # null -> the whole file
  n_particles: 20
  n_dims: 3

prior:
  # Where each of `sample_prior`'s four parameters comes from. Each takes a mapping;
  # a bare number is shorthand for {mode: fixed, value: <number>}.
  #
  #   fixed    used as written
  #   measure  read off the target data:
  #              k            inv_var_bond      1 / var(|bond|)
  #              b            mean_bond         E[|bond|]
  #              gamma        inv_two_var_cos   1 / (2 var(cos theta))
  #              cos_theta_0  mean_cos          E[cos theta]
  #   solve    cos_theta_0 only: bisect until the prior's E[Re^2] matches `target`,
  #            either the literal `end_to_end_sq` (measured on the data) or a number
  #
  # k and b are the SIMULATION Hamiltonian's values, not the data's moments (~91.5
  # and ~1.024). This matters: the thermodynamic-integration bridge in the notebook
  # reconciles the interpolant's dS against an external TI result by subtracting an
  # analytic prior-vs-ideal offset, and that subtraction is only valid if the prior's
  # bond law IS the simulation's. Switch to the commented `measure` forms only if you
  # are not doing that reconciliation.
  k: 100.0
  # k: {mode: measure, estimator: inv_var_bond}
  b: 1.0
  # b: {mode: measure, estimator: mean_bond}
  gamma: {mode: measure, estimator: inv_two_var_cos}
  cos_theta_0:
    # Fitted rather than measured, and deliberately: the reference chain's angular
    # correlations decay more slowly than any nearest-neighbour bending potential can
    # reproduce, so matching the observed <cos theta> would leave the chain too small.
    # Fitting E[Re^2] buys the correct global size instead, at the cost of an
    # over-stiff <cos theta> (+0.40 against the data's +0.25).
    mode: solve
    target: end_to_end_sq
  report_samples: 200000   # prior draws for the startup table; 0 skips it

model:
  hidden_nf: 32
  n_layers: 3
  index_feature: true      # normalised chain position i/(N-1) as a node feature
  bond_feature: true       # bonded/non-bonded flag as the edge attribute
  time_order: 4            # half-period Fourier harmonics of t ...
  index_order: 4           # ... and of the chain index. 4/4 with the index feature on
                           # gives in_node_nf = 18 and 47,146 parameters.
  path: linear             # interpolant path: linear | trig | trig2 | encdec
  gamma: sqrt              # LATENT NOISE SCHEDULE: none | quad | sqrt | sin2.
                           # Not prior.gamma, which is the bending constant. The two
                           # never meet, but the collision is easy to misread.
  gamma_scale: 0.2
  eps: 1.0e-6              # raise to ~1.0e-3 if the S_zdot channel is to be read:
                           # it floors the 1/gamma that channel divides by
  score_div_method: hutchinson    # only used when model.gamma is "none"
  n_hutchinson_probes: 32
  # learn_score is deliberately absent: TAPEESI forces it False, because the subspace
  # divergence runs under no_grad and cannot feed implicit score matching.
  # coords_range is absent too: make_si_model does not forward EGNN kwargs.

init:
  # Warm start for a NEW run -- step counters begin at zero and the config is this
  # file. Continuing the SAME run is `--resume`, which reads its config back out of
  # the checkpoint instead.
  checkpoint: null         # a run checkpoint, e.g. runs/tap_previous/checkpoints/latest.pt
  net_b: null              # or the bare weights the notebook writes, e.g.
  net_s: null              #   experiments/TAP/tap_b_si_N20_B256.pth (both or neither)

train:
  # Defaults for every stage; any stage may override any of them.
  batch: 256
  align: true              # OT over O(3)
  batch_ot: true           # OT over the minibatch assignment
  entropy: both            # null | dot | zdot | both. Must be the same in every stage:
                           # it sets how many columns a step records, and the run
                           # writes one history file with one header.
  log_every: 100
  ckpt_every: 2000         # steps between checkpoints; also the resume granularity
  reset_optimizer: true    # a fresh Adam at each stage boundary, which is what the
                           # notebook did; false carries Adam's moments across instead
  stages:
    - {name: coarse, steps: 100000, lr: 1.0e-4, seed: 9340}
    - {name: fine,   steps: 100000, lr: 1.0e-5, seed: 9341}

checkpoint:
  keep: 3                  # rolling checkpoints kept besides latest.pt and the
                           # per-stage finals, which are never pruned
  export_nets: true        # also write nets/tap_{b,s}_si_N20_B256.pth, the bare
                           # per-network format the notebook's load cell reads

# --- the analysis jobs: defaults, all overridable on the command line ---------

sample:                    # python -m eesi.systems.tap.run sample --run <dir>
  n: 5000
  n_steps: 100
  chunk: 500               # how many at once; caps peak memory, changes nothing else
  integrator: rk4          # rk4 (dynamics.rk4_sample) | heun | euler | sde
  sde_eps: 0.0             # diffusion coefficient; only read when integrator is sde
  seed: 4
  save_prior: false        # also keep the prior draw the samples came from

entropy:                   # python -m eesi.systems.tap.run entropy --run <dir>
  methods: [dot, zdot, div]
  batches: 100             # per-batch estimates from entropy_estimate; 0 skips them
  batch: 256
  align: true              # the coupling used for the estimator's endpoints
  batch_ot: true
  seed: 5
  flow_n: 2000             # trajectories for the running dS(t); 0 skips it
  flow_steps: 100
  flow_channels: [div, dot]
  flow_chunk: 500
  flow_seed: 6
