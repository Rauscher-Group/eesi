[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eesi"
version = "0.1.0"
description = "Entropy Estimation by Stochastic Interpolants — Euclidean particle systems with a cutoff EGNN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "tqdm",
    # scipy: `eesi.ot` imports linear_sum_assignment at module level, and has since
    # the first OT coupling landed. It was simply never declared.
    "scipy",
    # pyyaml: the config-driven run entry points (`eesi.config`, and each system's
    # `run` module).
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
log = ["tensorboard"]

[project.scripts]
eesi-fetch-data = "eesi.fetch:main"

[tool.setuptools.packages.find]
include = ["eesi*"]
